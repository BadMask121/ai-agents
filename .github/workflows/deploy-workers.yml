# Deploy the Cloudflare Workers when main changes (a merged PR or a push):
# only the Workers whose files changed, each after its own tests pass. A run
# can also be started by hand (Actions → Deploy Workers → Run workflow), which
# deploys all three.
#
# Needs two repository settings:
#   secrets.CLOUDFLARE_API_TOKEN   a Cloudflare API token ("Edit Cloudflare Workers" + D1 Edit)
#   vars.CLOUDFLARE_ACCOUNT_ID     the account the Workers live in
# Worker secrets (Fireworks, TypeSafe, Telegram…) stay in Cloudflare and are
# kept across deploys. The Mac app is never released from here: that needs
# the signing keys on the owner's Mac (apps/dj-sync/release.sh).
name: Deploy Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time; a newer push waits rather than cancelling one mid-way.
concurrency:
  group: deploy-workers
  cancel-in-progress: false

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      cloud: ${{ steps.filter.outputs.cloud }}
      site: ${{ steps.filter.outputs.site }}
      mail: ${{ steps.filter.outputs.mail }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            cloud:
              - 'apps/dj-sync-cloud/**'
            site:
              - 'apps/dj-sync-site/**'
              - 'apps/dj-sync/macos/VERSION'
            mail:
              - 'apps/mail-mcp/**'

  dj-sync-cloud:
    needs: changes
    if: needs.changes.outputs.cloud == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dj-sync-cloud
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @ai-agents/dj-sync-cloud
      - run: pnpm run typecheck
      - run: pnpm run test
      - name: Deploy
        run: pnpm exec wrangler deploy
      - name: Check it's up
        run: curl -fsS -o /dev/null -w "health %{http_code}\n" https://djsync.jeffrey.build/health

  dj-sync-site:
    needs: [changes, dj-sync-cloud]
    # After the cloud Worker (the site forwards to it), and even when that job was skipped.
    if: >-
      always() && !failure() && !cancelled() &&
      (needs.changes.outputs.site == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # The site has no dependencies of its own; deploy.sh uses dj-sync-cloud's wrangler.
      - run: pnpm install --frozen-lockfile --filter @ai-agents/dj-sync-cloud
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test, deploy and check (deploy.sh)
        working-directory: apps/dj-sync-site
        run: ./deploy.sh

  mail-mcp:
    needs: changes
    if: needs.changes.outputs.mail == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mail-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @ai-agents/mail-mcp
      - run: pnpm run typecheck
      - run: pnpm run test
      - name: Deploy
        run: pnpm exec wrangler deploy
