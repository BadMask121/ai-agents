server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Static landing page.
    location / {
        try_files $uri $uri/ =404;
    }

    # Release artifacts, served from a bind-mounted volume. Host
    # /data/prole-releases is mounted to /srv/prole-releases by Coolify; the
    # release script (scripts/release.sh in github.com/BadMask121/prole) puts
    # Prole-<version>.dmg there, points the Prole.dmg symlink at it, and rewrites
    # latest.json, which the page reads to link the newest version.
    location /download/ {
        alias /srv/prole-releases/;
        autoindex off;
        types {
            application/x-apple-diskimage  dmg;
        }
        default_type application/octet-stream;
        add_header Content-Disposition "attachment";
    }

    # Release manifest: JSON, never a download, always revalidated.
    location = /download/latest.json {
        alias /srv/prole-releases/latest.json;
        default_type application/json;
        add_header Cache-Control "no-cache";
    }

    # Light caching for static assets.
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
