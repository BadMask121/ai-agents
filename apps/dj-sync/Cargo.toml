[package]
name = "dj-sync"
version = "1.3.1"
edition = "2021"
description = "Telegram-driven Spotify -> Rekordbox prep pipeline"

[[bin]]
name = "dj-sync"
path = "src/main.rs"

# Release tooling (keygen / sign / verify for the update feed and the tools
# manifest). Not part of the installed service:
#   cargo run --features release-tools --bin dj-sync-sign -- …
[[bin]]
name = "dj-sync-sign"
path = "src/bin/dj-sync-sign.rs"
required-features = ["release-tools"]

[features]
release-tools = []

[dependencies]
tokio = { version = "1", features = ["full"] }
teloxide = { version = "0.12", features = ["macros"] }

reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

lofty = "0.18"
walkdir = "2"
strsim = "0.11"
unicode-normalization = "0.1"
quick-xml = { version = "0.31", features = ["serialize"] }

anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

dotenvy = "0.15"
toml = "0.8"
dirs = "5"
url = "2"
percent-encoding = "2"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["limit", "trace"] }
subtle = "2"
sha2 = "0.10"
tokio-tungstenite = { version = "0.26", features = ["native-tls"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
flate2 = "1"
ed25519-dalek = "2"
base64 = "0.22"
zip = { version = "2", default-features = false, features = ["deflate"] }
tar = "0.4"
regex = "1"
once_cell = "1"
bincode = "1"
plist = "1"

[dev-dependencies]
axum = { version = "0.8", features = ["ws"] }
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
